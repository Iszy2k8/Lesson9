<!DOCTYPE html>
<html>

<head>
    <title>My Hobby Cards</title>
    <meta charset="utf-3">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- STEP 1 - Bootstrap CSS link -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            padding: 30px 15px;
        }

        h1 {
            text-align: center;
            color: #FF5A43;
        }

        .hobby-card {
            text-align: center;
            border: 2px solid #FF5A43;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fff8e1;
        }

        .hobby-card h3 {
            color: #FF5A43;
        }
    </style>
</head>

<body>

    <h1>My Hobby Cards</h1>

    <!-- STEP 2 - container keeps the layout neat and centred -->
    <div class="container">

    <!-- STEP 3  - rows hold all the columns in horizontal line -->
    <div class="row">
        
            <!-- STEP 4 - col-12: full width on phones
                             col-md-6: half width on tablets
                             col-lg-4: one-third on desktops -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Watching</h3>
                    <p>I like watching anime in my free time</p>
                </div>
            </div>
        
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Football</h3>
                    <p>I play football in school with my friends.</p>
                </div>
            </div>
        
            <div class="col-12 col-md-12 col-lg-4">
                <div class="hobby-card">
                    <h3>coding</h3>
                    <p>I like coding in computer science class</p>
                </div>
            </div>
        
        </div>
        </div>
        
        <!-- STEP 5 - Bootstrap JS script -->
        <script src="https://bootstrapcdn.com"></script>
        
        </body>
        
        </html>
